name: Unit Test Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  unit-test-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore AiUnitTestPoc.slnx

      - name: Build solution
        run: dotnet build AiUnitTestPoc.slnx --no-restore

      - name: Run unit tests
        run: dotnet test AiUnitTestPoc.slnx --no-build --collect:"XPlat Code Coverage"

      - name: Detect changed C# files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Changed C# files:"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- '*.cs'

      - name: Analyze changed C# code
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          chmod +x scripts/analyze-code.sh
          ./scripts/analyze-code.sh    